<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="say-6 doctor mobile app — Flutter PWA for emergency room AI triage">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="say6_doctor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>say6_doctor</title>
  <link rel="manifest" href="manifest.json">

  <!-- 데모: 노트북에서 실제 아이폰처럼 보이도록 폰 프레임 안에 앱을 렌더 -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 28%, #3b4452, #0f1722 70%);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    /* 아이폰 본체(베젤) */
    #phone {
      position: relative;
      aspect-ratio: 393 / 852;          /* iPhone 15 Pro 비율 */
      height: min(852px, 94vh);
      background: #0b0b0d;
      border-radius: 54px;
      padding: 13px;                     /* 베젤 두께 */
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.55),
        inset 0 0 0 2px #2b2b30,
        0 0 0 2px #000;
      box-sizing: border-box;
    }
    /* 화면 — 앱이 전체를 채움 (페이지별 상단 여백은 Flutter EmonTopBar가 처리) */
    #flutter-host {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 42px;
      overflow: hidden;
      background: #ffffff;
    }
    /* Dynamic Island / 노치 — 화면 위 중앙 오버레이 */
    #notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 33%;
      height: 26px;
      background: #000;
      border-radius: 14px;
      z-index: 2147483647;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="phone">
    <div id="flutter-host"></div>
    <div id="notch"></div>
  </div>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      config: {
        hostElement: document.getElementById("flutter-host"),
      },
    });
  </script>
</body>
</html>
